<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>FS Express · GTA 6 (brouillon hors planning)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Inter:wght@400;600;700&display=swap">
<style>
  /* Visuel 1080 x 1350 (format feed 4:5). Brouillon HORS PLANNING semaine 1, non publié.
     « GTA 6 » n'apparaît qu'en texte, comme référence : pas de logo, pas d'image du jeu, rien qui suggère un partenariat avec l'éditeur.
     Textes : l'accroche est nouvelle ; les engagements, la carte et l'appel reprennent le texte validé.
     Palette FS Express : bleu #1690C1, rouge #93241E, navy #0A3D57, blanc cassé #FBFBF8. */
  html, body { margin: 0; padding: 0; background: #0A3D57; }
  #post { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #0A3D57; color: #FBFBF8; font-family: 'Inter', Arial, sans-serif; }
  .abs { position: absolute; }
  .kick { left: 90px; top: 76px; font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: 0.22em; text-transform: uppercase; color: #7CC7E6; }
  .logo { left: 880px; top: 70px; width: 110px; height: 110px; border-radius: 30px; background: #FBFBF8; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  .logo img { width: 90px; height: auto; display: block; }
  .h1 { left: 90px; top: 140px; font-family: 'Archivo', Arial, sans-serif; font-weight: 900; font-size: 118px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
  .hl { background: #93241E; color: #FBFBF8; padding: 0 0.16em; border-radius: 0.14em; }
  .sub { left: 90px; top: 392px; width: 900px; font-weight: 600; font-size: 46px; line-height: 1.3; }
  .card { left: 90px; top: 540px; width: 900px; border-radius: 44px; background: #FBFBF8; color: #0A3D57; overflow: hidden; box-shadow: 0 40px 90px rgba(0, 0, 0, 0.35); }
  .card-head { background: #1690C1; color: #FBFBF8; padding: 26px 40px; font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: 0.2em; text-transform: uppercase; display: flex; align-items: center; gap: 18px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: #93241E; flex: 0 0 18px; }
  .card-title { font-family: 'Archivo', Arial, sans-serif; font-weight: 900; font-size: 60px; line-height: 1.02; letter-spacing: -0.015em; padding: 30px 40px 10px; }
  .check { display: flex; align-items: center; gap: 26px; padding: 10px 40px; font-weight: 700; font-size: 40px; line-height: 1.1; }
  .tick { width: 64px; height: 64px; border-radius: 50%; background: #1690C1; flex: 0 0 64px; display: flex; align-items: center; justify-content: center; }
  .tick svg { width: 36px; height: 36px; display: block; }
  .card-pad { height: 20px; }
  .map { left: 90px; top: 1020px; }
  .cta { left: 0; right: 0; top: 1162px; text-align: center; font-weight: 600; font-size: 40px; line-height: 1.2; }
  .pill { position: absolute; left: 50%; top: 1228px; transform: translateX(-50%); background: #FBFBF8; color: #93241E; border-radius: 999px; font-family: 'Archivo', Arial, sans-serif; font-weight: 900; font-size: 64px; line-height: 1; padding: 0.2em 0.42em 0.22em; white-space: nowrap; }
</style>
</head>
<body>

<!-- Dessins FS Express (mêmes formes que la vidéo « Qui sommes-nous » avec images) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="sym-scooter" viewBox="0 0 600 420">

      <rect x="96" y="92" width="176" height="118" rx="16" fill="#0A3D57"/>
      <rect x="96" y="186" width="176" height="24" rx="8" fill="#93241E"/>
      <text x="184" y="166" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-weight="900" font-size="58" fill="#FBFBF8">FS</text>
      <path d="M92 262 C92 232 112 214 146 214 L330 214 C352 214 366 224 382 240 L430 270 C452 280 470 282 492 282 L500 300 L110 300 C98 300 92 288 92 274 Z" fill="#93241E"/>
      <path d="M430 270 L468 142 L486 138 L486 172 L462 282 Z" fill="#0A3D57"/>
      <path d="M458 132 L522 116" stroke="#0A3D57" stroke-width="12" stroke-linecap="round"/>
      <circle cx="508" cy="262" r="11" fill="#FBFBF8"/>
      <path d="M214 196 C214 184 224 178 240 178 L320 178 C332 178 340 186 340 198 L340 214 L214 214 Z" fill="#0A3D57"/>
      <path d="M300 214 L330 214 L364 262 L346 272 L300 224 Z" fill="#0A3D57"/>
      <path d="M300 168 C300 142 320 132 346 132 C372 132 392 146 396 172 L402 214 L300 214 Z" fill="#1690C1"/>
      <path d="M340 172 Q384 150 458 128" stroke="#1690C1" stroke-width="22" stroke-linecap="round" fill="none"/>
      <circle cx="462" cy="128" r="13" fill="#93241E"/>
      <circle cx="350" cy="92" r="42" fill="#0A3D57"/>
      <rect x="340" y="82" width="50" height="20" rx="10" fill="#1690C1"/>
      <circle cx="150" cy="330" r="66" fill="#0A3D57"/>
      <circle cx="452" cy="330" r="66" fill="#0A3D57"/>
      <circle cx="150" cy="330" r="24" fill="#FBFBF8"/>
      <circle cx="452" cy="330" r="24" fill="#FBFBF8"/>
      <circle cx="150" cy="330" r="8" fill="#0A3D57"/>
      <circle cx="452" cy="330" r="8" fill="#0A3D57"/>
    </symbol>
    <symbol id="sym-pin" viewBox="0 0 120 160">
      <path d="M60 4 C28 4 4 28 4 60 C4 100 60 156 60 156 C60 156 116 100 116 60 C116 28 92 4 60 4 Z" fill="#93241E"/>
      <circle cx="60" cy="60" r="22" fill="#FBFBF8"/>
    </symbol>
    <pattern id="streets" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M0 0 H160 M0 0 V160" stroke="#1690C1" stroke-opacity="0.22" stroke-width="14" fill="none"/>
    </pattern>
  </defs>
</svg>

<div id="post">
  <svg class="abs" style="left:0; top:0" width="1080" height="1350" aria-hidden="true">
    <rect width="1080" height="1350" fill="url(#streets)"/>
  </svg>

  <div class="abs kick">FS Express · Yaoundé</div>
  <div class="abs logo"><img src="../../video/assets/logo.jpg" alt="Logo FS Express"></div>

  <div class="abs h1"><span class="hl">GTA 6</span><br>est sorti.</div>
  <div class="abs sub">Votre prochaine mission&nbsp;:<br>livrer vos commandes.</div>

  <div class="abs card">
    <div class="card-head"><span class="dot"></span>Nouvelle mission</div>
    <div class="card-title">Livrer vos commandes</div>
    <div class="check"><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#FBFBF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Livreurs identifiés</div>
    <div class="check"><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#FBFBF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Argent reversé vite</div>
    <div class="check"><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#FBFBF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Livraison dans les zones de Yaoundé</div>
    <div class="card-pad"></div>
  </div>

  <svg class="abs map" width="900" height="120" viewBox="0 0 900 120" aria-hidden="true">
    <rect x="0" y="0" width="900" height="120" rx="30" fill="#E3F0F7"/>
    <path d="M0 40 H900 M300 0 V120 M610 0 V120" stroke="#FBFBF8" stroke-width="10" fill="none"/>
    <path d="M30 112 C240 122 380 56 560 76 S760 90 820 88" fill="none" stroke="#93241E" stroke-width="8" stroke-dasharray="18 14" stroke-linecap="round"/>
    <use href="#sym-scooter" x="36" y="0" width="170" height="119"/>
    <use href="#sym-pin" x="790" y="12" width="60" height="80"/>
  </svg>

  <div class="abs cta">Envoyez votre première livraison sur WhatsApp&nbsp;:</div>
  <div class="pill">687 53 53 73</div>
</div>

</body>
</html>
